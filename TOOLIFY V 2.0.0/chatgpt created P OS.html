<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal OS</title>
<style>
:root{--glass:rgba(22,27,32,.72);--glass2:rgba(255,255,255,.095);--line:rgba(255,255,255,.17);--text:#f5f7fa;--muted:#aeb8c3;--accent:#d9ff79;--accentText:#18210b;--shadow:0 22px 70px #0008}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
body{overflow:hidden;background:#222}
.wallpaper{position:fixed;inset:0;background:#252a30 url("bg.jpg") center/cover no-repeat;z-index:-3}
.wallpaper:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#070b10a8,#10151b55 55%,#05080a88)}
button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}
.os{height:100%;display:flex;flex-direction:column;padding:15px 18px 12px;gap:14px}
.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border:1px solid var(--line);border-radius:17px;background:var(--glass);backdrop-filter:blur(22px);box-shadow:0 8px 30px #0003}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.2px}.brandmark{width:29px;height:29px;border-radius:9px;background:var(--accent);color:var(--accentText);display:grid;place-items:center;font-weight:900}
.topright{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:13px}.liveclock{font-size:14px;color:#fff;font-variant-numeric:tabular-nums}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ffffff22;color:#fff}
.workspace{display:flex;gap:14px;min-height:0;flex:1}
.rail{width:72px;flex:0 0 72px;border:1px solid var(--line);border-radius:20px;background:var(--glass);backdrop-filter:blur(22px);display:flex;flex-direction:column;align-items:center;padding:12px 8px;gap:8px}
.rail button{width:48px;height:46px;border:0;background:transparent;border-radius:14px;color:#d4dbe3;font-size:19px;display:grid;place-items:center;position:relative}
.rail button:hover,.rail button.active{background:#ffffff1c;color:var(--accent)}.rail .spacer{flex:1}
.main{min-width:0;flex:1;display:flex;flex-direction:column;gap:14px}
.welcome{display:flex;align-items:flex-end;justify-content:space-between;padding:7px 5px 0}.welcome h1{font-size:27px;margin:0 0 5px;font-weight:650;letter-spacing:-.8px}.welcome p{margin:0;color:#d0d7df;font-size:13px}.date-label{font-size:13px;color:#e6eaf0}
.content{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.9fr);gap:14px}
.leftcol,.rightcol{min-height:0;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(22px);box-shadow:var(--shadow);padding:18px;min-width:0}
.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.panelhead h2{font-size:15px;margin:0;font-weight:650}.muted{color:var(--muted);font-size:12px}
.quickstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:15px;border-radius:16px;background:var(--glass2);border:1px solid #ffffff12}.stat .symbol{font-size:17px;color:var(--accent)}.stat .num{font-size:25px;font-weight:650;margin-top:9px}.stat .caption{font-size:11px;color:var(--muted);margin-top:2px}
.taskpanel{flex:1;min-height:210px;display:flex;flex-direction:column}.tasklist{overflow:auto;display:flex;flex-direction:column;gap:7px}.taskrow{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff0b}.taskrow input{accent-color:var(--accent);width:16px;height:16px}.taskrow .tasktext{flex:1;font-size:13px;overflow-wrap:anywhere}.taskrow.done .tasktext{text-decoration:line-through;color:#8e9aa6}.priority{font-size:10px;color:var(--muted);border:1px solid #ffffff22;border-radius:20px;padding:3px 7px}.iconbtn{border:1px solid #ffffff20;background:#ffffff10;border-radius:10px;padding:7px 10px;font-size:12px}.iconbtn:hover{background:#ffffff22}.accentbtn{border:0;border-radius:10px;background:var(--accent);color:var(--accentText);font-weight:700;padding:9px 13px;font-size:12px}.quickapps{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.appshortcut{border:1px solid #ffffff17;background:#ffffff0d;border-radius:15px;padding:13px 8px;text-align:center;min-height:80px}.appshortcut:hover{background:#ffffff1d;transform:translateY(-1px)}.appshortcut b{display:block;font-size:20px;margin-bottom:7px}.appshortcut span{font-size:11px;color:#d5dce4}
.rightcol .panel{flex:1;min-height:0}.note-preview{height:calc(100% - 35px);font-size:13px;line-height:1.55;color:#d5dce4;white-space:pre-wrap;overflow:auto}
.calendar-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.calendar-mini span{font-size:10px;color:var(--muted);padding:5px 0}.calendar-mini button{border:0;background:transparent;color:#edf0f3;border-radius:8px;padding:7px 0;font-size:11px}.calendar-mini button.today{background:var(--accent);color:var(--accentText);font-weight:800}.calendar-mini button.has-event:after{content:"";display:block;width:3px;height:3px;background:var(--accent);border-radius:50%;margin:2px auto 0}
.dock{align-self:center;display:flex;gap:7px;padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(22px);box-shadow:0 10px 35px #0005}.dock button{width:42px;height:40px;border:0;border-radius:12px;background:#ffffff0e;font-size:19px}.dock button:hover{background:#ffffff28;transform:translateY(-2px)}
/* app windows */
.modalback{position:fixed;inset:0;background:#0007;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}.modalback.open{display:flex}
.window{width:min(900px,96vw);height:min(690px,88vh);border:1px solid #ffffff2b;border-radius:22px;background:rgba(20,25,31,.94);backdrop-filter:blur(28px);box-shadow:0 30px 100px #000b;display:flex;flex-direction:column;overflow:hidden}
.winbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid #ffffff18}.wintitle{font-weight:650;font-size:14px}.wincontrols{display:flex;gap:7px}.wincontrols button{width:29px;height:29px;border:0;border-radius:9px;background:#ffffff13}.winbody{padding:18px;overflow:auto;flex:1}
.close:hover{background:#a33!important}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.field{background:#ffffff0d;border:1px solid #ffffff20;color:#fff;border-radius:10px;padding:10px 12px;outline:none;min-width:0}.field:focus{border-color:var(--accent)}.field::placeholder{color:#87929d}select.field option{background:#1c2229}
textarea.field{resize:vertical;min-height:100px;width:100%;line-height:1.5}
.listitem{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid #ffffff14;background:#ffffff09;border-radius:12px;margin-bottom:8px}.listitem .grow{flex:1;min-width:0}.listitem small{color:var(--muted);display:block;margin-top:3px}.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.noteslayout{display:grid;grid-template-columns:250px 1fr;gap:13px;height:100%;min-height:300px}.notelist{overflow:auto;border-right:1px solid #ffffff18;padding-right:10px}.noteitem{padding:11px;border-radius:10px;margin-bottom:6px;background:#ffffff0b;cursor:pointer}.noteitem.selected{background:#d9ff7922;border:1px solid #d9ff7955}.noteitem b{font-size:12px}.noteitem small{display:block;color:var(--muted);margin-top:4px}.editor{display:flex;flex-direction:column;gap:10px}.editor input{font-size:18px;font-weight:650}.editor textarea{flex:1;min-height:260px}
.cal-layout{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-grid div,.cal-grid button{text-align:center;padding:11px 2px;border-radius:10px}.cal-grid .weekday{font-size:11px;color:var(--muted)}.cal-grid button{background:#ffffff0b;border:1px solid transparent;color:#fff}.cal-grid button.selected{border-color:var(--accent);background:#d9ff7920}.cal-grid button.today{color:var(--accent);font-weight:800}.eventbox{padding:12px;border:1px solid #ffffff18;border-radius:12px;margin:8px 0;background:#ffffff09}
.calc{max-width:340px;margin:auto}.calcdisplay{width:100%;height:72px;text-align:right;font-size:28px;margin-bottom:10px}.calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calcgrid button{height:55px;border:1px solid #ffffff15;background:#ffffff10;border-radius:13px;font-size:17px}.calcgrid button.op{color:var(--accent)}.calcgrid button.equal{background:var(--accent);color:var(--accentText);font-weight:800}
.timer{text-align:center;padding:30px}.timerdisplay{font-size:62px;font-variant-numeric:tabular-nums;font-weight:300;margin:15px}.timer button{margin:4px}
.settingsrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #ffffff15;font-size:13px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#e9ffad;color:#1a230b;padding:10px 15px;border-radius:12px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:40}.toast.show{opacity:1}
@media(max-width:950px){.content{grid-template-columns:1fr}.rightcol{display:grid;grid-template-columns:1fr 1fr}.quickstats{grid-template-columns:repeat(2,1fr)}.taskpanel{min-height:250px}.welcome h1{font-size:22px}}
@media(max-width:620px){.os{padding:8px;gap:8px}.topbar{height:48px}.topright{gap:8px}.rail{width:48px;flex-basis:48px}.rail button{width:36px;height:39px}.welcome{align-items:flex-start;flex-direction:column;gap:5px}.welcome h1{font-size:20px}.quickstats{gap:7px}.stat{padding:10px}.stat .num{font-size:21px}.rightcol{display:flex}.quickapps{grid-template-columns:repeat(4,1fr)}.dock{gap:3px;padding:5px}.dock button{width:36px;height:36px}.noteslayout,.cal-layout{grid-template-columns:1fr}.notelist{max-height:120px;border:0;border-bottom:1px solid #ffffff18}.window{height:92vh}.winbody{padding:12px}}
</style>
</head>
<body>
<div class="wallpaper"></div>
<div class="os">
 <header class="topbar">
  <div class="brand"><div class="brandmark">P</div><span>Personal OS</span></div>
  <div class="topright"><span id="topDate"></span><span class="liveclock" id="topClock">--:--:--</span><span class="avatar">T</span></div>
 </header>
 <div class="workspace">
  <nav class="rail" aria-label="Main apps">
   <button class="active" data-app="home" title="Home">⌂</button>
   <button data-app="tasks" title="Tasks">☑</button>
   <button data-app="notes" title="Notes">▤</button>
   <button data-app="calendar" title="Calendar">▦</button>
   <button data-app="clock" title="Clock & timer">◷</button>
   <button data-app="calculator" title="Calculator">＋</button>
   <div class="spacer"></div><button data-app="settings" title="Settings">⚙</button>
  </nav>
  <main class="main">
   <section class="welcome"><div><h1 id="greeting">Good evening, Taha.</h1><p>Your personal space. One place to think, plan and get things done.</p></div><div class="date-label" id="longDate"></div></section>
   <section class="content">
    <div class="leftcol">
     <div class="quickstats">
      <div class="stat"><span class="symbol">☑</span><div class="num" id="statTasks">0</div><div class="caption">Tasks left</div></div>
      <div class="stat"><span class="symbol">▤</span><div class="num" id="statNotes">0</div><div class="caption">Saved notes</div></div>
      <div class="stat"><span class="symbol">▦</span><div class="num" id="statEvents">0</div><div class="caption">Upcoming events</div></div>
      <div class="stat"><span class="symbol">◷</span><div class="num" id="statFocus">25</div><div class="caption">Focus minutes</div></div>
     </div>
     <section class="panel taskpanel"><div class="panelhead"><h2>Today's tasks</h2><button class="accentbtn" data-app="tasks">＋ Add task</button></div><div class="tasklist" id="homeTasks"></div></section>
     <section class="panel"><div class="panelhead"><h2>Workspace</h2><span class="muted">Your everyday tools</span></div><div class="quickapps">
      <button class="appshortcut" data-app="tasks"><b>☑</b><span>Task manager</span></button>
      <button class="appshortcut" data-app="notes"><b>▤</b><span>Notes</span></button>
      <button class="appshortcut" data-app="calendar"><b>▦</b><span>Calendar</span></button>
      <button class="appshortcut" data-app="calculator"><b>＋</b><span>Calculator</span></button>
     </div></section>
    </div>
    <div class="rightcol">
     <section class="panel"><div class="panelhead"><h2>Calendar</h2><button class="iconbtn" data-app="calendar">Open ↗</button></div><div class="calendar-mini" id="miniCalendar"></div></section>
     <section class="panel"><div class="panelhead"><h2>Quick note</h2><button class="iconbtn" data-app="notes">All notes ↗</button></div><div class="note-preview" id="notePreview">Your notes will appear here.</div></section>
    </div>
   </section>
  </main>
 </div>
 <nav class="dock"><button data-app="home" title="Home">⌂</button><button data-app="tasks" title="Tasks">☑</button><button data-app="notes" title="Notes">▤</button><button data-app="calendar" title="Calendar">▦</button><button data-app="clock" title="Clock">◷</button><button data-app="calculator" title="Calculator">＋</button></nav>
</div>
<div class="modalback" id="modal"><section class="window"><header class="winbar"><div class="wintitle" id="winTitle">App</div><div class="wincontrols"><button id="minimize" title="Minimize">—</button><button class="close" id="close" title="Close">×</button></div></header><div class="winbody" id="winBody"></div></section></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem('pos_'+k))??f}catch{return f}};
const save=(k,v)=>localStorage.setItem('pos_'+k,JSON.stringify(v));
let tasks=load('tasks',[]),notes=load('notes',[]),events=load('events',[]),selectedNote=null,calDate=new Date(),selectedDay=new Date().toISOString().slice(0,10),timerInterval=null,secondsLeft=1500,calcValue='0';
const today=()=>new Date().toISOString().slice(0,10);
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateClock(){let d=new Date();$('#topClock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('#topDate').textContent=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});$('#longDate').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'});let h=d.getHours();$('#greeting').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', Taha.'}
function updateHome(){
 $('#statTasks').textContent=tasks.filter(t=>!t.done).length;$('#statNotes').textContent=notes.length;$('#statEvents').textContent=events.filter(e=>e.date>=today()).length;
 let list=$('#homeTasks');let visible=tasks.filter(t=>!t.done).slice(0,5);list.innerHTML=visible.length?visible.map(t=>`<div class="taskrow"><input type="checkbox" onchange="toggleTask('${t.id}')" aria-label="Complete task"><span class="tasktext">${esc(t.text)}</span><span class="priority">${esc(t.priority||'Normal')}</span></div>`).join(''):'<div class="empty">All clear. Add a task when something comes up ✨</div>';
 let n=notes[0];$('#notePreview').textContent=n?(n.body||'Empty note'): 'No notes yet. Open Notes to capture an idea.';
 renderMiniCalendar();
}
function toggleTask(id){let t=tasks.find(x=>x.id===id);if(t)t.done=!t.done;save('tasks',tasks);updateHome();if($('#modal').classList.contains('open')&&$('#winTitle').textContent==='Task Manager')openApp('tasks')}
function renderMiniCalendar(){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),el=$('#miniCalendar');let out=['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('');for(let i=0;i<first;i++)out+='<span></span>';for(let n=1;n<=days;n++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,has=events.some(e=>e.date===date);out+=`<button class="${date===today()?'today':''} ${has?'has-event':''}" onclick="openCalendarOn('${date}')">${n}</button>`}el.innerHTML=out}
function openApp(app){let modal=$('#modal'),body=$('#winBody');modal.classList.add('open');$$('.rail button').forEach(b=>b.classList.toggle('active',b.dataset.app===app));let titles={tasks:'Task Manager',notes:'Notes',calendar:'Calendar',clock:'Clock & Focus',calculator:'Calculator',settings:'Settings'};$('#winTitle').textContent=titles[app]||'Home';
 if(app==='tasks')renderTasks(body);if(app==='notes')renderNotes(body);if(app==='calendar')renderCalendar(body);if(app==='clock')renderClock(body);if(app==='calculator')renderCalculator(body);if(app==='settings')renderSettings(body);
}
function closeApp(){$('#modal').classList.remove('open');$$('.rail button').forEach(b=>b.classList.toggle('active',b.dataset.app==='home'))}
function renderTasks(el){el.innerHTML=`<div class="toolbar"><input id="newTask" class="field" placeholder="What needs to get done?" style="flex:1"><select id="taskPriority" class="field"><option>Normal</option><option>High</option><option>Low</option></select><button class="accentbtn" onclick="addTask()">Add task</button></div><div class="toolbar"><button class="iconbtn" onclick="taskFilter('all')">All</button><button class="iconbtn" onclick="taskFilter('active')">Active</button><button class="iconbtn" onclick="taskFilter('done')">Completed</button><button class="iconbtn" onclick="clearDone()">Clear completed</button></div><div id="taskAppList"></div>`;renderTaskRows('all')}
let currentTaskFilter='all';
function taskFilter(f){currentTaskFilter=f;renderTaskRows(f)}
function renderTaskRows(f){let el=$('#taskAppList');if(!el)return;let arr=tasks.filter(t=>f==='all'||(f==='active'&&!t.done)||(f==='done'&&t.done));el.innerHTML=arr.length?arr.map(t=>`<div class="listitem"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="grow" style="${t.done?'text-decoration:line-through;opacity:.55':''}">${esc(t.text)}<small>${esc(t.priority||'Normal')} priority · ${new Date(t.created).toLocaleDateString()}</small></div><button class="iconbtn" onclick="deleteTask('${t.id}')">Delete</button></div>`).join(''):'<div class="empty">Nothing in this list.</div>'}
function addTask(){let input=$('#newTask'),text=input.value.trim();if(!text){toast('Write a task first');return}tasks.unshift({id:crypto.randomUUID(),text,priority:$('#taskPriority').value,done:false,created:Date.now()});save('tasks',tasks);input.value='';renderTaskRows(currentTaskFilter);updateHome()}
function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);save('tasks',tasks);renderTaskRows(currentTaskFilter);updateHome()}
function clearDone(){tasks=tasks.filter(t=>!t.done);save('tasks',tasks);renderTaskRows(currentTaskFilter);updateHome()}
function renderNotes(el){if(!selectedNote||!notes.some(n=>n.id===selectedNote))selectedNote=notes[0]?.id||null;el.innerHTML=`<div class="toolbar"><button class="accentbtn" onclick="newNote()">＋ New note</button><span class="muted">Autosaves on your device</span></div><div class="noteslayout"><div class="notelist" id="noteList"></div><div class="editor" id="noteEditor"></div></div>`;drawNotes()}
function drawNotes(){let list=$('#noteList'),editor=$('#noteEditor');if(!list||!editor)return;list.innerHTML=notes.map(n=>`<div class="noteitem ${n.id===selectedNote?'selected':''}" onclick="selectNote('${n.id}')"><b>${esc(n.title||'Untitled')}</b><small>${new Date(n.updated).toLocaleDateString()}</small></div>`).join('')||'<div class="empty">No notes yet.</div>';let n=notes.find(x=>x.id===selectedNote);editor.innerHTML=n?`<input class="field" id="noteTitle" value="${esc(n.title)}" placeholder="Note title"><textarea class="field" id="noteBody" placeholder="Start writing...">${esc(n.body)}</textarea><div class="toolbar"><button class="iconbtn" onclick="deleteNote('${n.id}')">Delete note</button><span class="muted" id="saveStatus">Saved locally</span></div>`:'<div class="empty">Create a note to get started.</div>';if(n){$('#noteTitle').addEventListener('input',saveCurrentNote);$('#noteBody').addEventListener('input',saveCurrentNote)}}
function saveCurrentNote(){let n=notes.find(x=>x.id===selectedNote);if(!n)return;n.title=$('#noteTitle').value;n.body=$('#noteBody').value;n.updated=Date.now();save('notes',notes);let status=$('#saveStatus');if(status)status.textContent='Saved';updateHome()}
function newNote(){let n={id:crypto.randomUUID(),title:'',body:'',updated:Date.now()};notes.unshift(n);selectedNote=n.id;save('notes',notes);drawNotes();$('#noteTitle').focus();updateHome()}
function selectNote(id){selectedNote=id;drawNotes()}
function deleteNote(id){notes=notes.filter(n=>n.id!==id);selectedNote=notes[0]?.id||null;save('notes',notes);drawNotes();updateHome()}
function renderCalendar(el){el.innerHTML=`<div class="cal-layout"><div><div class="cal-head"><button class="iconbtn" onclick="changeMonth(-1)">←</button><b id="monthTitle"></b><button class="iconbtn" onclick="changeMonth(1)">→</button></div><div class="cal-grid" id="calGrid"></div></div><div><div class="panelhead"><h2 id="selectedDateTitle">Events</h2></div><div id="eventList"></div><hr style="border-color:#ffffff18;margin:16px 0"><input type="text" id="eventTitle" class="field" style="width:100%;margin-bottom:8px" placeholder="Event title"><input type="date" id="eventDate" class="field" style="width:100%;margin-bottom:8px"><input type="time" id="eventTime" class="field" style="width:100%;margin-bottom:8px"><button class="accentbtn" style="width:100%" onclick="addEvent()">Add event</button></div></div>`;drawCalendar()}
function changeMonth(n){calDate.setMonth(calDate.getMonth()+n);drawCalendar()}
function openCalendarOn(date){selectedDay=date;openApp('calendar')}
function drawCalendar(){let grid=$('#calGrid');if(!grid)return;let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();$('#monthTitle').textContent=calDate.toLocaleDateString([],{month:'long',year:'numeric'});let s=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<first;i++)s+='<div></div>';for(let d=1;d<=days;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,has=events.some(e=>e.date===date);s+=`<button class="${date===today()?'today':''} ${date===selectedDay?'selected':''}" onclick="selectCalendarDay('${date}')">${d}${has?' •':''}</button>`}grid.innerHTML=s;$('#eventDate').value=selectedDay;$('#selectedDateTitle').textContent=new Date(selectedDay+'T12:00:00').toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});let arr=events.filter(e=>e.date===selectedDay).sort((a,b)=>a.time.localeCompare(b.time));$('#eventList').innerHTML=arr.length?arr.map(e=>`<div class="eventbox"><b>${esc(e.title)}</b><small>${esc(e.time||'All day')} · <button class="iconbtn" onclick="deleteEvent('${e.id}')">Remove</button></small></div>`).join(''):'<div class="empty">No events on this date.</div>'}
function selectCalendarDay(d){selectedDay=d;drawCalendar()}
function addEvent(){let title=$('#eventTitle').value.trim(),date=$('#eventDate').value,time=$('#eventTime').value;if(!title||!date){toast('Add an event title and date');return}events.push({id:crypto.randomUUID(),title,date,time});save('events',events);$('#eventTitle').value='';selectedDay=date;drawCalendar();updateHome()}
function deleteEvent(id){events=events.filter(e=>e.id!==id);save('events',events);drawCalendar();updateHome()}
function renderClock(el){el.innerHTML=`<div class="timer"><div class="muted">LOCAL TIME</div><div class="timerdisplay" id="bigClock">--:--:--</div><div id="bigDate" class="muted"></div><hr style="border-color:#ffffff18;margin:25px 0"><div class="muted">FOCUS TIMER</div><div class="timerdisplay" id="timerDisplay">25:00</div><div class="toolbar" style="justify-content:center"><button class="accentbtn" onclick="startTimer()">Start</button><button class="iconbtn" onclick="pauseTimer()">Pause</button><button class="iconbtn" onclick="resetTimer()">Reset</button></div><div class="toolbar" style="justify-content:center"><button class="iconbtn" onclick="setTimer(15)">15 min</button><button class="iconbtn" onclick="setTimer(25)">25 min</button><button class="iconbtn" onclick="setTimer(45)">45 min</button></div></div>`;tickBigClock();showTimer()}
function tickBigClock(){let d=new Date();let c=$('#bigClock');if(c){c.textContent=d.toLocaleTimeString();$('#bigDate').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})}}
function showTimer(){let e=$('#timerDisplay');if(e)e.textContent=String(Math.floor(secondsLeft/60)).padStart(2,'0')+':'+String(secondsLeft%60).padStart(2,'0')}
function startTimer(){if(timerInterval)return;timerInterval=setInterval(()=>{if(secondsLeft>0){secondsLeft--;showTimer()}else{pauseTimer();toast('Focus session complete! Take a short break.')}},1000)}
function pauseTimer(){clearInterval(timerInterval);timerInterval=null}
function resetTimer(){pauseTimer();secondsLeft=1500;showTimer()}
function setTimer(m){pauseTimer();secondsLeft=m*60;showTimer()}
function renderCalculator(el){el.innerHTML=`<div class="calc"><input class="field calcdisplay" id="calcDisplay" value="0" readonly><div class="calcgrid">${['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map((x,i)=>`<button class="${['÷','×','−','+','%'].includes(x)?'op':''} ${x==='='?'equal':''}" onclick="calcPress('${x}')">${x}</button>`).join('')}</div></div>`}
function calcPress(k){let d=$('#calcDisplay');if(!d)return;if(k==='C')calcValue='0';else if(k==='⌫')calcValue=calcValue.length>1?calcValue.slice(0,-1):'0';else if(k==='±')calcValue=String(-Number(calcValue));else if(k==='='){try{let exp=calcValue.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+\-*/.() ]+$/.test(exp))throw 0;let result=Function('"use strict";return ('+exp+')')();calcValue=Number.isFinite(result)?String(Number(result.toFixed(8))):'Error'}catch{calcValue='Error'}}else{if(calcValue==='0'||calcValue==='Error')calcValue='';calcValue+=k}d.value=calcValue||'0'}
function renderSettings(el){el.innerHTML=`<div class="panelhead"><h2>Personalize your OS</h2></div><div class="settingsrow"><div><b>Display name</b><div class="muted">Used in your welcome message</div></div><input class="field" id="displayName" value="Taha" style="width:150px"></div><div class="settingsrow"><div><b>Accent color</b><div class="muted">Change highlight color</div></div><input type="color" id="accentColor" value="#d9ff79" style="width:48px;height:35px;background:transparent;border:0"></div><div class="settingsrow"><div><b>Background image</b><div class="muted">Keep your image named bg.jpg beside this HTML file</div></div><span class="muted">bg.jpg</span></div><div class="settingsrow"><div><b>Local data</b><div class="muted">Tasks, notes and events are saved in this browser</div></div><button class="iconbtn" onclick="exportData()">Export backup</button></div><div class="settingsrow"><div><b>Restore backup</b><div class="muted">Import a previously exported JSON file</div></div><label class="iconbtn">Import<input type="file" accept="application/json" onchange="importData(event)" hidden></label></div><div class="settingsrow"><div><b>Clear all data</b><div class="muted">Permanently remove locally saved tasks, notes and events</div></div><button class="iconbtn" onclick="clearAllData()">Clear data</button></div>`;$('#displayName').addEventListener('change',e=>{$('#greeting').textContent='Welcome back, '+e.target.value+'.';localStorage.setItem('pos_name',e.target.value)});$('#accentColor').addEventListener('input',e=>document.documentElement.style.setProperty('--accent',e.target.value))}
function exportData(){let blob=new Blob([JSON.stringify({tasks,notes,events},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='personal-os-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importData(ev){let file=ev.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);tasks=Array.isArray(d.tasks)?d.tasks:[];notes=Array.isArray(d.notes)?d.notes:[];events=Array.isArray(d.events)?d.events:[];save('tasks',tasks);save('notes',notes);save('events',events);updateHome();toast('Backup restored');renderSettings($('#winBody'))}catch{toast('Invalid backup file')}};r.readAsText(file)}
function clearAllData(){if(!confirm('Delete all tasks, notes and events from this browser?'))return;tasks=[];notes=[];events=[];save('tasks',tasks);save('notes',notes);save('events',events);updateHome();toast('Local data cleared')}
$$('[data-app]').forEach(b=>b.addEventListener('click',()=>{let app=b.dataset.app;if(app==='home'){closeApp();return}openApp(app)}));
$('#close').addEventListener('click',closeApp);$('#minimize').addEventListener('click',closeApp);$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeApp()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeApp()});
setInterval(()=>{updateClock();tickBigClock()},1000);updateClock();updateHome();
const savedName=localStorage.getItem('pos_name');if(savedName)$('#greeting').textContent='Welcome back, '+savedName+'.';
</script>
</body>
</html>
