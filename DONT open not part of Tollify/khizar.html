<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal OS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--y:#fdf9b4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Poppins,sans-serif;color:#fff;font-size:14px;height:100vh;height:100dvh;background:#55585b url("bg.jpg") center/cover no-repeat fixed;display:flex;gap:20px;padding:24px;align-items:center;justify-content:center}
nav,#win{background:rgba(70,70,70,.38);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #fff5;box-shadow:0 15px 40px #0004}
nav{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:40px;max-height:100%;overflow:auto;scrollbar-width:none}
nav button{width:48px;height:48px;flex:none;border-radius:50%;font-size:20px;background:none}
nav button.on{background:#fff4}
#win{width:min(1180px,100%);height:min(760px,100%);border-radius:40px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:22px;font-weight:600}h3{font-size:14px;font-weight:500;margin-bottom:10px}
#view{flex:1;overflow:auto;min-height:0}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{grid-column:span 4;border:1px solid #fff5;border-radius:20px;background:#ffffff12;padding:18px;min-width:0}
.s3{grid-column:span 3}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.link{cursor:pointer}.link:hover{background:#ffffff22}
.big{font-size:44px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}.mid{font-size:26px;font-weight:600}.dim{opacity:.7;font-size:12px}
button,input,select,textarea{font:inherit;color:#fff;border:0;outline:0}
button{background:#fff3;border-radius:12px;padding:8px 14px;cursor:pointer;transition:.15s}
button:hover{filter:brightness(1.15)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--y)}
.y{background:var(--y)!important;color:#222}
input,select,textarea{background:#0003;border-radius:12px;padding:9px 12px;min-width:0;max-width:100%}
option{color:#000}input::placeholder,textarea::placeholder{color:#fff9}
input[type=range]{padding:0;background:none;accent-color:var(--y);width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.between{justify-content:space-between}
.item{display:flex;gap:10px;align-items:center;background:#ffffff17;border-radius:12px;padding:8px 10px;margin-top:8px}
.item span{flex:1;overflow-wrap:anywhere}.done span{text-decoration:line-through;opacity:.5}
.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--y)}
.x{background:none;padding:2px 8px}
.sw{width:44px;height:23px;border-radius:20px;padding:0;position:relative;background:#fff4;flex:none}
.sw::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#ddd;top:3px;left:3px;transition:.2s}
.sw.on{background:var(--y)}.sw.on::after{left:24px;background:#000}
.bars{display:flex;align-items:flex-end;gap:10px;height:180px}
.bars button{flex:none;padding:0;border-radius:20px;max-width:22px;margin-top:auto}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;gap:6px;font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal button{padding:8px 0;background:#ffffff10}.cal .today{outline:2px solid var(--y)}.cal .has{text-decoration:underline var(--y) 3px;text-underline-offset:5px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys button{padding:14px;font-size:18px}
textarea{width:100%;min-height:340px;resize:vertical}
.dial{width:190px;height:190px;margin:12px auto;display:grid;place-items:center;position:relative}
.dial::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 220deg,var(--y) calc(var(--p)*280deg),#fff8 0 280deg,transparent 0);-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));mask:radial-gradient(closest-side,transparent calc(100% - 8px),#000 calc(100% - 7px))}
.dial b{font-size:46px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--y);color:#222;padding:12px 20px;border-radius:14px;display:none;z-index:9;cursor:pointer}
@media(max-width:800px){body{flex-direction:column-reverse;padding:10px;gap:10px}nav{flex-direction:row;max-width:100%}#win{flex:1;min-height:0;padding:14px;border-radius:24px}.card{grid-column:span 12!important}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="win">
  <header><div><h1 id="title"></h1><div class="dim" id="hello"></div></div><div class="mid" id="topclock"></div></header>
  <section id="view"></section>
</main>
<div id="toast" role="status"></div>
<audio id="audio"></audio>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

/* ---------- Saved data (localStorage) ---------- */
const DEF={name:'Dost',accent:'#fdf9b4',tasks:[],notes:[],note:null,events:{},alarms:[],money:[],
 habits:[{n:'Exercise',d:{}},{n:'Reading',d:{}}],
 devices:[{n:'Humidifier',b:'Gaabor',on:true},{n:'Speaker',b:'Amazon Echo',on:false},{n:'Smart Lamp',b:'Manon',on:true},{n:'Smart Fan',b:'Liqyuid',on:false}],
 temp:24,thermo:true,mode:'Eco',bright:50,power:[120,95,170,130,150,140]};
let D=structuredClone(DEF);
try{Object.assign(D,JSON.parse(localStorage.getItem('myos')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('myos',JSON.stringify(D))}catch(e){toast('Data save nahi ho saka (storage full ya band)')}};

let page='home',sel=key(new Date()),calM=new Date(),expr='',filter='All',q='';
let sw={on:false,start:0,acc:0,laps:[]},tm={end:0,left:0},songs=[],song=0;
const audio=$('#audio');

const APPS={home:['🏠','Home'],tasks:['✅','Tasks'],notes:['📝','Notes'],calendar:['📅','Calendar'],clock:['⏰','Clock'],devices:['💡','Smart Home'],habits:['🔥','Habits'],money:['💰','Expenses'],music:['🎵','Music'],calc:['🧮','Calculator'],settings:['⚙️','Settings']};

/* ---------- Helpers ---------- */
const btn=(act,label,i='',cls='')=>`<button class="${cls}" data-act="${act}" data-i="${i}">${label}</button>`;
const card=(body,cls='',go='')=>`<div class="card ${cls} ${go?'link':''}" ${go?`data-act="go" data-i="${go}"`:''}>${body}</div>`;
const toggle=(on,act,i='')=>`<button class="sw ${on?'on':''}" data-act="${act}" data-i="${i}" role="switch" aria-checked="${on}" aria-label="On/Off"></button>`;
const empty=t=>`<p class="dim" style="margin-top:10px">${t}</p>`;
function beep(){try{const c=new AudioContext();[0,.3,.6].forEach(t=>{const o=c.createOscillator();o.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.2)})}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m+'  ✕';t.style.display='block'}
$('#toast').onclick=e=>e.target.style.display='none';
const taskRow=(t,i)=>`<div class="item ${t.done?'done':''}"><input type="checkbox" data-chg="task" data-i="${i}" ${t.done?'checked':''} aria-label="Done"><span>${esc(t.text)} <small class="dim">${t.pri}${t.due?' · '+t.due:''}</small></span>${btn('delTask','✕',i,'x')}</div>`;
const swTime=()=>sw.acc+(sw.on?Date.now()-sw.start:0);
const fmtSw=ms=>`${pad(ms/60000|0)}:${pad((ms/1000|0)%60)}.${pad((ms%1000)/10|0)}`;
const fmtTm=()=>{const s=Math.ceil((tm.end?Math.max(0,tm.end-Date.now()):tm.left)/1000);return `${pad(s/60|0)}:${pad(s%60)}`};

function calendar(){
 const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 let h=`<div class="row between">${btn('month','‹',-1)}<b>${calM.toLocaleString('en',{month:'long',year:'numeric'})}</b>${btn('month','›',1)}</div><div class="cal" style="margin-top:10px">`;
 h+=['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<small class="dim">${d}</small>`).join('')+'<i></i>'.repeat(first);
 for(let d=1;d<=n;d++){const k=key(new Date(y,m,d));h+=btn('day',d,k,[k===sel?'y':'',k===key(new Date())?'today':'',D.events[k]?.length?'has':''].join(' '))}
 return h+'</div>';
}
function chart(){
 const max=Math.max(...D.power,1);
 return `<h3>Power Consumption (kWh)</h3><div class="bars">${D.power.map((v,i)=>`<div><button style="height:${v/max*145}px;width:100%" class="${i===D.sel?'y':''}" data-act="bar" data-i="${i}" aria-label="${v} kWh"></button>${['Jan','Feb','Mar','Apr','May','Jun'][i]}</div>`).join('')}</div><p class="dim">${D.sel!=null?'Selected: '+D.power[D.sel]+' kWh':'Bar par click karein'}</p>`;
}
const thermo=()=>`<div class="row between"><h3>Thermostat</h3>${toggle(D.thermo,'thermo')}</div>
 <div class="dial" style="--p:${D.thermo?(D.temp-16)/14:0};opacity:${D.thermo?1:.5}"><b>${D.temp}°</b></div>
 <div class="row" style="justify-content:center">${btn('temp','−',-1)}<span class="dim">Celsius</span>${btn('temp','+',1)}</div>
 <div class="row" style="justify-content:center;margin-top:10px">${['Hot','Eco','Fan','Cold'].map(m=>btn('mode',m,m,D.mode===m?'y':'')).join('')}</div>`;
const player=()=>`<h3>🎵 ${songs.length?esc(songs[song].name):'Koi song select nahi'}</h3><input type="range" id="seek" value="${audio.currentTime/audio.duration*100||0}" aria-label="Seek">
 <div class="row" style="justify-content:center">${btn('skip','⏮',-1)}${btn('play',audio.paused?'▶':'⏸','','y')}${btn('skip','⏭',1)}</div>
 <label class="dim">Apni audio files chunein:<br><input type="file" accept="audio/*" multiple data-chg="songs"></label>`;

/* ---------- Pages ---------- */
const V={
home(){
 const open=D.tasks.filter(t=>!t.done),ev=D.events[key(new Date())]||[],spent=D.money.reduce((a,x)=>a+x.amt,0);
 return card(`<div class="big" data-live="time"></div><div data-live="date"></div>`,'','clock')
 +card(`<h3>Pending Tasks</h3><div class="big">${open.length}</div><div class="dim">${open[0]?esc(open[0].text):'Sab kaam mukammal 🎉'}</div>`,'','tasks')
 +card(`<h3>Aaj ke Events</h3><div class="big">${ev.length}</div><div class="dim">${ev[0]?esc(ev[0]):'Aaj koi event nahi'}</div>`,'','calendar')
 +card(calendar())+card(thermo())
 +card(`<h3>Quick Task</h3><form class="row" data-form="task"><input name="text" class="grow" placeholder="Naya task..." required><button class="y">Add</button></form>${open.slice(0,4).map(t=>taskRow(t,D.tasks.indexOf(t))).join('')}`)
 +card(`<h3>Notes</h3><div class="mid">${D.notes.length}</div>`,'s3','notes')+card(`<h3>Total Kharcha</h3><div class="mid">Rs ${spent.toLocaleString()}</div>`,'s3','money')
 +card(`<h3>Devices On</h3><div class="mid">${D.devices.filter(d=>d.on).length}/${D.devices.length}</div>`,'s3','devices')+card(`<h3>Habits Aaj</h3><div class="mid">${D.habits.filter(h=>h.d[key(new Date())]).length}/${D.habits.length}</div>`,'s3','habits');
},
tasks(){
 const list=D.tasks.map((t,i)=>[t,i]).filter(([t])=>filter==='All'||(filter==='Done')===t.done);
 return card(`<form class="row" data-form="task"><input name="text" class="grow" placeholder="Task likhein..." required><select name="pri" aria-label="Priority"><option>Normal</option><option>High</option><option>Low</option></select><input type="date" name="due" aria-label="Due date"><button class="y">Add Task</button></form>
 <div class="row" style="margin-top:14px">${['All','Active','Done'].map(f=>btn('filter',f,f,filter===f?'y':'')).join('')}<span class="grow"></span>${btn('clearDone','Done tasks hatayein')}</div>
 ${list.map(([t,i])=>taskRow(t,i)).join('')||empty('Yahan koi task nahi. Upar se add karein.')}`,'s12');
},
notes(){
 const n=D.notes.find(n=>n.id===D.note);
 return card(`<div class="row">${btn('newNote','+ New Note','','y')}</div><input id="search" placeholder="Search..." value="${esc(q)}" style="width:100%;margin-top:10px"><div id="nlist">${noteList()}</div>`)
 +card(n?`<div class="row"><input id="ntitle" class="grow" value="${esc(n.title)}" placeholder="Title">${btn('delNote','🗑 Delete')}${btn('dlNote','⬇ Download')}</div><textarea id="nbody" placeholder="Yahan likhein... (auto save)" style="margin-top:10px">${esc(n.body)}</textarea>`:empty('Note select karein ya naya banayein.'),'s8');
},
calendar(){
 const ev=D.events[sel]||[];
 return card(calendar(),'s6')+card(`<h3>Events: ${sel}</h3><form class="row" data-form="event"><input name="time" type="time" aria-label="Time"><input name="text" class="grow" placeholder="Event..." required><button class="y">Add</button></form>${ev.map((e,i)=>`<div class="item"><span>${esc(e)}</span>${btn('delEvent','✕',i,'x')}</div>`).join('')||empty('Is din koi event nahi.')}`,'s6');
},
clock(){
 return card(`<h3>Clock</h3><div class="big" data-live="time"></div><div data-live="date"></div><h3 style="margin-top:20px">World Clock</h3>${[['Karachi','Asia/Karachi'],['Dubai','Asia/Dubai'],['London','Europe/London'],['New York','America/New_York'],['Tokyo','Asia/Tokyo']].map(([c,z])=>`<div class="item"><span>${c}</span><b data-zone="${z}"></b></div>`).join('')}`)
 +card(`<h3>Stopwatch</h3><div class="big" data-live="sw">${fmtSw(swTime())}</div><div class="row">${btn('swToggle',sw.on?'Pause':'Start','','y')}${btn('lap','Lap')}${btn('swReset','Reset')}</div>${sw.laps.map((l,i)=>`<div class="item"><span>Lap ${i+1}</span>${l}</div>`).join('')}`)
 +card(`<h3>Timer</h3><div class="big" data-live="tm">${fmtTm()}</div><form class="row" data-form="timer"><input name="min" type="number" min="0.1" step="0.1" placeholder="Minutes" required style="width:110px"><button class="y">Start</button></form><div class="row" style="margin-top:8px">${btn('tmPause',tm.end?'Pause':'Resume')}${btn('tmReset','Reset')}</div>
 <h3 style="margin-top:20px">Alarm</h3><form class="row" data-form="alarm"><input type="time" name="time" required aria-label="Alarm time"><button class="y">Set</button></form>${D.alarms.map((a,i)=>`<div class="item"><span>${a.t}</span>${toggle(a.on,'alarm',i)}${btn('delAlarm','✕',i,'x')}</div>`).join('')}<p class="dim">Alarm tab khula hone par hi bajega.</p>`);
},
devices(){
 return D.devices.map((d,i)=>card(`<div class="row between"><span style="font-size:24px">🔌</span>${toggle(d.on,'device',i)}</div><div style="margin-top:20px">${esc(d.b)}</div><div class="mid" style="font-size:18px">${esc(d.n)}</div><div class="row between dim">${d.on?'On':'Off'}${btn('delDevice','✕',i,'x')}</div>`,'s3')).join('')
 +card(`<h3>Add Device</h3><form data-form="device" class="row"><input name="n" placeholder="Device" required><input name="b" placeholder="Brand"><button class="y">Add</button></form>`)
 +card(thermo())+card(chart())+card(`<h3>Lamp Brightness</h3><div class="big" id="bval">${D.bright}%</div><input type="range" id="bright" value="${D.bright}" aria-label="Brightness"><p class="dim">Demo controls: asli devices se connected nahi.</p>`,'s12');
},
habits(){
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
 return card(`<form class="row" data-form="habit"><input name="n" class="grow" placeholder="Nayi habit..." required><button class="y">Add</button></form>${D.habits.map((h,i)=>`<div class="item"><span>${esc(h.n)}</span><div class="row">${days.map(d=>btn('habit',d.getDate(),i+'|'+key(d),h.d[key(d)]?'y':'')).join('')}</div>${btn('delHabit','✕',i,'x')}</div>`).join('')}`,'s12');
},
money(){
 const total=D.money.reduce((a,x)=>a+x.amt,0);
 return card(`<h3>Total Kharcha</h3><div class="big">Rs ${total.toLocaleString()}</div>`)+card(`<form class="row" data-form="money"><input name="t" class="grow" placeholder="Kis cheez par?" required><input name="amt" type="number" min="1" placeholder="Rs" required style="width:120px"><button class="y">Add</button></form>${D.money.map((x,i)=>`<div class="item"><span>${esc(x.t)} <small class="dim">${x.d}</small></span><b>Rs ${x.amt.toLocaleString()}</b>${btn('delMoney','✕',i,'x')}</div>`).join('')||empty('Abhi koi kharcha nahi.')}`,'s8');
},
music(){return card(player(),'s6')+card(`<h3>Playlist</h3>${songs.map((s,i)=>`<div class="item"><span>${esc(s.name)}</span>${btn('song','▶',i,i===song?'y':'')}</div>`).join('')||empty('Audio files chunein. Page reload par playlist khali ho jati hai.')}`,'s6')},
calc(){return card(`<input id="screen" readonly value="${esc(expr)||0}" style="width:100%;font-size:30px;text-align:right;margin-bottom:12px" aria-label="Result"><div class="keys">${['C','⌫','%','/','7','8','9','*','4','5','6','-','1','2','3','+','00','0','.','='].map(k=>btn('key',k,k,k==='='?'y':'')).join('')}</div>`,'s6')},
settings(){
 return card(`<h3>Aap ka naam</h3><form class="row" data-form="name"><input name="n" value="${esc(D.name)}" required><button class="y">Save</button></form><h3 style="margin-top:20px">Accent color</h3><input type="color" data-chg="accent" value="${D.accent}" style="width:70px;height:44px">`,'s6')
 +card(`<h3>Backup</h3><div class="row">${btn('export','⬇ Export data','','y')}<label class="dim">Import: <input type="file" accept=".json" data-chg="import"></label></div><h3 style="margin-top:20px">Screen</h3><div class="row">${btn('full','⛶ Fullscreen')}${btn('reset','Sab data reset')}</div>`,'s6');
}};
const noteList=()=>D.notes.filter(n=>(n.title+n.body).toLowerCase().includes(q.toLowerCase())).map(n=>`<div class="item link" data-act="openNote" data-i="${n.id}"><span>${esc(n.title||'Untitled')}</span>${n.id===D.note?'●':''}</div>`).join('')||empty('Koi note nahi.');

/* ---------- Render ---------- */
function render(){
 document.documentElement.style.setProperty('--y',D.accent);
 $('#nav').innerHTML=Object.entries(APPS).map(([k,[ic,n]])=>`<button class="${k===page?'on':''}" data-act="go" data-i="${k}" title="${n}" aria-label="${n}">${ic}</button>`).join('');
 $('#title').textContent=APPS[page][1];
 const h=new Date().getHours();
 $('#hello').textContent=`${h<12?'Subah bakhair':h<17?'Good afternoon':'Shaam bakhair'}, ${D.name}`;
 const top=$('#view').scrollTop;
 $('#view').innerHTML=`<div class="grid">${V[page]()}</div>`;
 $('#view').scrollTop=top;live();
}
function live(){
 const n=new Date(),t=n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
 $('#topclock').textContent=t;
 const set=(s,v)=>document.querySelectorAll(s).forEach(e=>e.textContent=v);
 set('[data-live=time]',t);set('[data-live=date]',n.toDateString());set('[data-live=sw]',fmtSw(swTime()));set('[data-live=tm]',fmtTm());
 document.querySelectorAll('[data-zone]').forEach(e=>e.textContent=n.toLocaleTimeString('en-US',{timeZone:e.dataset.zone,hour:'2-digit',minute:'2-digit'}));
}

/* ---------- Click actions ---------- */
function playSong(i){if(!songs.length)return toast('Pehle Music app mein audio file chunein');song=(i+songs.length)%songs.length;audio.src=songs[song].url;audio.play().then(render).catch(()=>toast('Ye file play nahi ho saki'))}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text]));a.download=name;a.click()}
const A={
 go:i=>{page=i;$('#view').scrollTop=0},
 delTask:i=>D.tasks.splice(i,1),filter:i=>filter=i,clearDone:()=>D.tasks=D.tasks.filter(t=>!t.done),
 newNote:()=>{const id=Date.now();D.notes.unshift({id,title:'',body:''});D.note=id;q=''},openNote:i=>D.note=+i,
 delNote:()=>{if(confirm('Note delete karein?'))D.notes=D.notes.filter(n=>n.id!==D.note)},
 dlNote:()=>{const n=D.notes.find(n=>n.id===D.note);download((n.title||'note')+'.txt',n.body)},
 month:i=>calM=new Date(calM.getFullYear(),calM.getMonth()+ +i,1),day:i=>sel=i,delEvent:i=>D.events[sel].splice(i,1),
 swToggle:()=>{if(sw.on)sw.acc=swTime();else sw.start=Date.now();sw.on=!sw.on},
 lap:()=>{if(sw.on)sw.laps.push(fmtSw(swTime()))},swReset:()=>sw={on:false,start:0,acc:0,laps:[]},
 tmPause:()=>{if(tm.end){tm.left=Math.max(0,tm.end-Date.now());tm.end=0}else if(tm.left)tm.end=Date.now()+tm.left},tmReset:()=>tm={end:0,left:0},
 alarm:i=>D.alarms[i].on=!D.alarms[i].on,delAlarm:i=>D.alarms.splice(i,1),
 device:i=>D.devices[i].on=!D.devices[i].on,delDevice:i=>D.devices.splice(i,1),
 thermo:()=>D.thermo=!D.thermo,temp:i=>{if(D.thermo)D.temp=Math.min(30,Math.max(16,D.temp+ +i))},mode:i=>D.mode=i,bar:i=>D.sel=+i,
 habit:i=>{const[h,k]=i.split('|');D.habits[h].d[k]=!D.habits[h].d[k]},delHabit:i=>D.habits.splice(i,1),
 delMoney:i=>D.money.splice(i,1),
 play:()=>{if(!songs.length){page='music';toast('Audio files chunein')}else if(!audio.src)playSong(song);else audio.paused?audio.play():audio.pause()},
 skip:i=>playSong(song+ +i),song:i=>playSong(+i),
 key:k=>{
  if(k==='C')expr='';else if(k==='⌫')expr=expr.slice(0,-1);
  else if(k==='='){try{if(!/^[\d+\-*/.%\s]+$/.test(expr))throw 0;const r=Function('return '+expr.replace(/%/g,'/100').replace(/\b0+(?=\d)/g,'').replace(/-/g,' - '))();expr=Number.isFinite(r)?String(+r.toFixed(10)):'Error'}catch(e){expr='Error'}}
  else expr=(expr==='Error'?'':expr)+k},
 export:()=>download('my-os-backup.json',JSON.stringify(D)),
 full:()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(),
 reset:()=>{if(confirm('Sara data delete ho jayega. Pakka?'))D=structuredClone(DEF)}
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 // Card ke andar button/input ho to card wala click ignore karein
 const inner=e.target.closest('button,input,select,label');if(inner&&inner!==b&&b.contains(inner))return;
 A[b.dataset.act](b.dataset.i);save();render();
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),type=e.target.dataset.form;
 for(const k in f)f[k]=f[k].trim();
 if([...e.target.querySelectorAll('[required]')].some(i=>!i.value.trim()))return;
 if(type==='task')D.tasks.unshift({text:f.text,pri:f.pri||'Normal',due:f.due||'',done:false});
 if(type==='event')(D.events[sel]??=[]).push((f.time?f.time+' - ':'')+f.text);
 if(type==='timer')tm={end:Date.now()+f.min*60000,left:0};
 if(type==='alarm')D.alarms.push({t:f.time,on:true});
 if(type==='device')D.devices.push({n:f.n,b:f.b,on:false});
 if(type==='habit')D.habits.push({n:f.n,d:{}});
 if(type==='money')D.money.unshift({t:f.t,amt:+f.amt,d:key(new Date())});
 if(type==='name')D.name=f.n;
 save();render();
});
document.addEventListener('change',e=>{
 const el=e.target,c=el.dataset.chg;if(!c)return;
 if(c==='task')D.tasks[el.dataset.i].done=el.checked;
 if(c==='accent')D.accent=el.value;
 if(c==='songs'){songs=[...el.files].map(f=>({name:f.name,url:URL.createObjectURL(f)}));if(songs.length)playSong(0)}
 if(c==='import'){el.files[0]?.text().then(t=>{const x=JSON.parse(t);if(!Array.isArray(x.tasks)||!Array.isArray(x.notes))throw 0;D={...structuredClone(DEF),...x};save();render();toast('Data import ho gaya')}).catch(()=>toast('Backup file sahi nahi'));return}
 save();render();
});
document.addEventListener('input',e=>{
 const el=e.target,n=D.notes.find(n=>n.id===D.note);
 if(el.id==='ntitle'){n.title=el.value;$('#nlist').innerHTML=noteList()}
 if(el.id==='nbody')n.body=el.value;
 if(el.id==='search'){q=el.value;$('#nlist').innerHTML=noteList()}
 if(el.id==='bright'){D.bright=+el.value;$('#bval').textContent=D.bright+'%'}
 if(el.id==='seek'&&audio.duration)audio.currentTime=el.value/100*audio.duration;
 save();
});
document.addEventListener('keydown',e=>{
 if(page!=='calc')return;
 const k={Enter:'=',Backspace:'⌫',Escape:'C'}[e.key]||e.key;
 if(/^([\d+\-*/.%=C]|⌫)$/.test(k)){e.preventDefault();A.key(k);render()}
});
audio.ontimeupdate=()=>{const s=$('#seek');if(s&&audio.duration)s.value=audio.currentTime/audio.duration*100};
audio.onplay=audio.onpause=()=>render();
audio.onended=()=>playSong(song+1);

/* ---------- Live clock, timer, alarm ---------- */
let rang='';
setInterval(()=>{
 live();
 if(tm.end&&Date.now()>=tm.end){tm={end:0,left:0};beep();toast('⏰ Timer khatam!');if(page==='clock')render()}
 const n=new Date(),t=pad(n.getHours())+':'+pad(n.getMinutes()),stamp=key(n)+t;
 if(rang!==stamp&&D.alarms.some(a=>a.on&&a.t===t)){rang=stamp;beep();toast('⏰ Alarm: '+t)}
},50);
render();
</script>
</body>
</html>
